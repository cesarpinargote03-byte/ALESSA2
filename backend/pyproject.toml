[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-zimbra-backend"
version = "0.1.0"
description = "FastAPI backend for Outlook-Zimbra request management"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "filelock>=3.17,<4",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "msal>=1.31,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pywin32>=308; sys_platform == 'win32'",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
